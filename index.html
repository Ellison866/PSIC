<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mind Blocks — Terrain</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">Mind Blocks · terrain prototype</p>
        <h1>Voxel <span>Valley</span></h1>
        <p class="intro">A quiet first step: textured terrain blocks, rendered from a fixed first-person view.</p>
        <p id="world-seed" class="seed">SEED 20261120</p>
      </header>
      <section class="terrain-card" aria-label="Textured voxel terrain">
        <canvas id="terrain-canvas" aria-label="Fixed first-person textured voxel terrain"></canvas>
        <span class="crosshair" aria-hidden="true">+</span>
        <div class="movement-pad" aria-label="Touch movement controls">
          <button type="button" data-move='{"x":0,"z":1}' aria-label="Move forward">▲</button>
          <button type="button" data-move='{"x":1,"z":0}' aria-label="Move left">◀</button>
          <button type="button" data-move='{"x":0,"z":-1}' aria-label="Move backward">▼</button>
          <button type="button" data-move='{"x":-1,"z":0}' aria-label="Move right">▶</button>
        </div>
      </section>
      <p class="movement-help">Move with <b>WASD</b> or the arrow keys. Use the directional pad on a phone.</p>
      <div class="legend" aria-label="Block texture legend">
        <span><i class="swatch grass"></i>Grass</span>
        <span><i class="swatch dirt"></i>Dirt</span>
        <span><i class="swatch stone"></i>Stone</span>
        <span><i class="swatch water"></i>Water</span>
        <span><i class="swatch wood"></i>Wood</span>
      </div>
    </main>
    <script type="importmap">
      {"imports":{"three":"https://unpkg.com/three@0.180.0/build/three.module.js"}}
    </script>
    <script type="module" src="game.js"></script>
  </body>
</html>
